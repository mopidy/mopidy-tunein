[project]
name = "mopidy-tunein"
description = "Mopidy extension for playing music from TuneIn"
readme = "README.md"
requires-python = ">= 3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Nick Steel", email = "nickasteel@gmail.com" }]
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dynamic = ["version"]
dependencies = [
    "httpx >= 0.28.1",
    "mopidy >= 4.0.0",
    "pykka >= 4.1",
]

[project.urls]
Homepage = "https://github.com/mopidy/mopidy-tunein"

[project.entry-points."mopidy.ext"]
tunein = "mopidy_tunein:Extension"


[build-system]
requires = ["setuptools >= 78", "setuptools-scm >= 8.2"]
build-backend = "setuptools.build_meta"


[dependency-groups]
dev = [
    "tox",
    "tox-uv",
    { include-group = "ruff" },
    { include-group = "tests" },
    { include-group = "typing" },
]
ruff = ["ruff"]
tests = ["pytest >= 8.3", "pytest-cov >= 5.0", "pytest-httpx"]
typing = ["pyright"]


[tool.coverage.paths]
source = ["src/", "*/site-packages/"]

[tool.coverage.run]
source_pkgs = ["mopidy_tunein"]

[tool.coverage.report]
show_missing = true


[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Not all dependencies have type hints:
reportMissingTypeStubs = false
# Already covered by ruff's flake8-self checks:
reportPrivateImportUsage = false


[tool.pytest.ini_options]
filterwarnings = [
    # By default, fail tests on warnings from our own code
    "error:::mopidy_tunein",
    #
    # Add any warnings you want to ignore here
]


[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Add rules you want to ignore here
    "BLE001",  # blind-except  # TODO
    "CPY",     # flake8-copyright
    "D",       # pydocstyle
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-summary-second-line
    "FIX002",  # line-contains-todo
    "G004",    # logging-f-string
    "PLW2901", # redefined-loop-name
    "S314",    # suspicious-xml-element-tree-usage -- ElementTree is safe given expat >= 2.6.1
    "SLF001",  # private-member-access  # TODO
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
    "TRY400",  # error-instead-of-exception
    #
    # Conflicting with `ruff format`
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ARG",     # flake8-unused-arguments
    "D",       # pydocstyle
    "PLR2004", # magic-value-comparison
    "S101",    # assert
]


[tool.setuptools.package-data]
"*" = ["*.conf"]


[tool.setuptools_scm]
# This section, even if empty, must be present for setuptools_scm to work


[tool.tox]
env_list = [
    "3.13-lowest",
    "3.13",
    "3.14",
    "3.15",
    "pyright",
    "ruff-check",
    "ruff-format",
]

[tool.tox.env_run_base]
package = "wheel"
wheel_build_env = ".pkg"
dependency_groups = ["tests"]
commands = [
    [
        "pytest",
        "--cov",
        "--basetemp={envtmpdir}",
        { replace = "posargs", extend = true },
    ],
]

[tool.tox.env."3.13-lowest"]
base_python = ["python3.13"]
uv_resolution = "lowest-direct"

[tool.tox.env.pyright]
dependency_groups = ["typing"]
commands = [["pyright", "{posargs:src}"]]

[tool.tox.env.ruff-check]
skip_install = true
dependency_groups = ["ruff"]
commands = [["ruff", "check", "{posargs:.}"]]

[tool.tox.env.ruff-format]
skip_install = true
dependency_groups = ["ruff"]
commands = [["ruff", "format", "--check", "--diff", "{posargs:.}"]]
